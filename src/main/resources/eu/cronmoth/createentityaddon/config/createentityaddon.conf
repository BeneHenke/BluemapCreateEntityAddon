##                              ##
##    Create Entity Addon       ##
##         Config               ##
##                              ##

# Enables or disables rendering of Create contraptions (moving machines like windmills, trains, etc.)
# Default is true
render-contraptions: true

# Determines whether Sable sub-levels are baked into the map tiles or saved as individual
# .prbm files to be served by the Create Train Web API.
# When set to true, sub-levels are rendered directly into the map.
# When set to false, sub-levels are written as separate .prbm files.
# Default is false
bake-sable-sublevels-into-map: false

# Enables or disables watching the Create track data file (create_tracks.dat) for changes.
# When enabled, train models are automatically regenerated when the track data changes.
# Default is true
watch-track-data-file: true

# The path to the Create track data file, relative to the world folder.
# Default is "data/create_tracks.dat"
track-data-file: "data/create_tracks.dat"

# The directory where generated train model files (.prbm) are stored, relative to the working directory.
# Default is "bluemap/train_models"
train-models-directory: "bluemap/train_models"

# The directory where Sable sub-level files (.prbm) are stored, relative to the working directory.
# Only used when bake-sable-sublevels-into-map is false.
# Default is "bluemap/sublevel_models"
sublevels-directory: "bluemap/sublevel_models"

